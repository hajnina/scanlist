name: main release
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.f.outputs.shared }}
      kotlin: ${{ steps.f.outputs.kotlin }}
      rn: ${{ steps.f.outputs.rn }}
      web: ${{ steps.f.outputs.web }}
      ci: ${{ steps.f.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            shared:
              - 'shared/**'
            kotlin:
              - 'apps/kotlin/**'
            rn:
              - 'apps/rn/**'
            web:
              - 'apps/web/**'
            ci:
              - '.github/workflows/**'

  shared:
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: ts-core typecheck + tests
        # Mirrors pr.yml: vitest alone let type errors in shared/ts-core through.
        # `npm run typecheck` is `tsc --noEmit` per its package.json.
        run: |
          if [ -f shared/ts-core/package.json ]; then
            cd shared/ts-core
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund
            npm run typecheck
            npm test
          elif [ -d shared/ts-core/src ]; then
            echo "::error::shared/ts-core has sources but no package.json - card not done"; exit 1
          else
            echo "::notice::no shared/ts-core yet - nothing to test"
          fi
      - name: android-embed build + JVM tests
        run: |
          if [ ! -f gradlew ] || [ ! -f settings.gradle.kts ]; then echo "::notice::no root gradle build yet (card S9) - skipping"; exit 0; fi
          if [ ! -f shared/android-embed/build.gradle.kts ]; then echo "::notice::no shared/android-embed module yet (card S5) - skipping"; exit 0; fi
          chmod +x gradlew
          ./gradlew --no-daemon :shared:android-embed:assembleDebug :shared:android-embed:testDebugUnitTest

  kotlin:
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          if [ ! -f gradlew ] || [ ! -f settings.gradle.kts ]; then echo "::error::no root gradle build yet (card S9) - cannot build apps/kotlin"; exit 1; fi
          if [ ! -f apps/kotlin/app/build.gradle.kts ] && [ ! -f apps/kotlin/build.gradle.kts ]; then echo "::error::apps/kotlin changed but has no module build file - card not done"; exit 1; fi
          chmod +x gradlew
          ./gradlew --no-daemon :scanlistKotlin:assembleDebug
      - name: Unit tests
        # Mirrors pr.yml: assembleDebug alone never ran apps/kotlin/app/src/test. Same root
        # build/wrapper as the step above (compiled debug classes are reused).
        run: |
          if [ ! -f gradlew ] || [ ! -f settings.gradle.kts ]; then echo "::error::no root gradle build yet (card S9) - cannot run apps/kotlin unit tests"; exit 1; fi
          chmod +x gradlew
          ./gradlew --no-daemon :scanlistKotlin:testDebugUnitTest
      - name: Unit test summary
        # Mirror of pr.yml: surface the real test totals (gradle prints none by default) so an
        # empty/zero-test run can never pass silently.
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          roots = [
              'apps/kotlin/app/build/test-results/testDebugUnitTest',
              'apps/kotlin/build/test-results/testDebugUnitTest',
          ]
          files = []
          for r in roots:
              files += sorted(glob.glob(r + '/TEST-*.xml'))
          if not files:
              sys.exit('::error::testDebugUnitTest produced no XML reports in ' + ' / '.join(roots))
          total = fails = errors = skipped = 0
          for path in files:
              node = ET.parse(path).getroot()
              total += int(node.get('tests', 0))
              fails += int(node.get('failures', 0))
              errors += int(node.get('errors', 0))
              skipped += int(node.get('skipped', 0))
          print(f'kotlin unit tests: {len(files)} classes, {total} tests, '
                f'{fails} failures, {errors} errors, {skipped} skipped')
          sys.exit(1 if (fails or errors or total == 0) else 0)
          PY
      - name: Rename APK
        if: hashFiles('apps/kotlin/app/build/outputs/apk/debug/*.apk') != ''
        run: mv apps/kotlin/app/build/outputs/apk/debug/*.apk ScanList-kotlin-debug.apk
      - uses: actions/upload-artifact@v4
        if: hashFiles('ScanList-kotlin-debug.apk') != ''
        with:
          name: scanlist-kotlin-apk
          path: ScanList-kotlin-debug.apk
          if-no-files-found: error

  rn:
    needs: changes
    if: needs.changes.outputs.rn == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: JS typecheck + jest
        # Mirrors pr.yml: jest + tsc gate the JS side before the APK build (fail fast). Node '22'
        # matches the web job pin and apps/rn's engines (>= 22.11.0).
        working-directory: apps/rn
        run: |
          if [ ! -f package.json ]; then echo "::error::apps/rn changed but has no package.json - card not done"; exit 1; fi
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run typecheck
          npm test -- --ci
      - name: Build release APK (bundled JS — the only shippable artifact)
        # assembleDebug is Metro-only (no assets/index.android.bundle) and must never reach the
        # rolling release: it fails on a phone with "Metro can't load the script".
        working-directory: apps/rn/android
        run: |
          if [ ! -f gradlew ]; then echo "::error::apps/rn changed but has no android gradle wrapper - card not done"; exit 1; fi
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Verify APK is standalone (JS bundle present, arm64 only)
        run: |
          apk=apps/rn/android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::release APK not found at $apk"; exit 1; }
          unzip -l "$apk" | grep -q 'assets/index.android.bundle' || {
            echo "::error::APK has no assets/index.android.bundle - it needs Metro and cannot ship"; exit 1; }
          bundle_bytes=$(unzip -l "$apk" | awk '/assets\/index.android.bundle/{print $1}')
          test "$bundle_bytes" -gt 100000 || { echo "::error::JS bundle suspiciously small: ${bundle_bytes} bytes"; exit 1; }
          if unzip -l "$apk" | grep -qE 'lib/(x86|x86_64|armeabi-v7a)/'; then
            echo "::error::non-arm64 ABIs packaged into the shipping APK"; exit 1; fi
          echo "standalone OK: JS bundle ${bundle_bytes} bytes, arm64-v8a only"
      - name: Rename APK
        # Direct path (mirrors the pr.yml fix, A2 review): the '**' variant made hashFiles
        # walk the whole android build tree and hit GitHub's 120 s template limit.
        if: hashFiles('apps/rn/android/app/build/outputs/apk/release/*.apk') != ''
        run: mv apps/rn/android/app/build/outputs/apk/release/*.apk ScanList-rn-release.apk
      - uses: actions/upload-artifact@v4
        if: hashFiles('ScanList-rn-release.apk') != ''
        with:
          name: scanlist-rn-apk
          path: ScanList-rn-release.apk
          if-no-files-found: error

  rn-smoke:
    # Launch proof for the shipping shape. The arm64 APK cannot install on the x86_64 runner, so
    # the same release variant is rebuilt with -PreactNativeArchitectures=x86_64; only the ABI
    # differs. A failure here means the artifact must not be published.
    needs: changes
    if: needs.changes.outputs.rn == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build x86_64 release APK for the emulator
        working-directory: apps/rn
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PreactNativeArchitectures=x86_64
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch, screenshot the real screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -e
            apk=apps/rn/android/app/build/outputs/apk/release/app-release.apk
            adb install -r "$apk"
            adb shell pm grant dev.hajnina.scanlist.rn android.permission.CAMERA || true
            adb logcat -c
            adb shell am start -W -n dev.hajnina.scanlist.rn/.MainActivity | tee launch.txt
            grep -q "Status: ok" launch.txt
            sleep 15
            pid=$(adb shell pidof dev.hajnina.scanlist.rn)
            test -n "$pid" || { echo "::error::app process not running after launch"; exit 1; }
            adb exec-out screencap -p > screen-1-lists.png
            if adb logcat -d | grep -q "FATAL EXCEPTION"; then
              echo "::error::app crashed on launch"; adb logcat -d | tail -150; exit 1; fi
            tap_text() {
              adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || return 1
              adb pull /sdcard/window.xml . >/dev/null 2>&1 || return 1
              python3 - "$1" <<'PY'
            import re, subprocess, sys, xml.etree.ElementTree as ET
            needle = sys.argv[1].lower()
            root = ET.parse('window.xml').getroot()
            for node in root.iter('node'):
                label = ((node.get('text') or '') + ' ' + (node.get('content-desc') or '')).strip()
                if needle in label.lower():
                    x1, y1, x2, y2 = map(int, re.findall(r'\d+', node.get('bounds')))
                    subprocess.run(['adb', 'shell', 'input', 'tap',
                                    str((x1 + x2) // 2), str((y1 + y2) // 2)], check=True)
                    print('tapped:', label)
                    sys.exit(0)
            sys.exit(1)
            PY
            }
            tap_text "Settings" && { sleep 3; adb exec-out screencap -p > screen-2-settings.png; adb shell input keyevent 4; sleep 3; } || true
            tap_text "Magic scan" && { sleep 4; adb exec-out screencap -p > screen-3-scan.png; adb shell input keyevent 4; sleep 2; } || true
            if adb logcat -d | grep -q "FATAL EXCEPTION"; then
              echo "::error::app crashed during navigation"; adb logcat -d | tail -150; exit 1; fi
            echo "SMOKE PASS: pid=$pid"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rn-screens
          path: |
            screen-*.png
            launch.txt
          if-no-files-found: warn
          retention-days: 7

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend
        run: |
          if [ -f apps/web/frontend/package.json ]; then
            cd apps/web/frontend
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund
            npm test --if-present
            npm run build --if-present
          elif [ -d apps/web/frontend/src ]; then
            echo "::error::apps/web/frontend has sources but no package.json - card not done"; exit 1
          else
            echo "::notice::no apps/web/frontend yet - skipping frontend build"
          fi
      - name: Server tests
        run: |
          if [ -f apps/web/server/requirements.txt ]; then
            cd apps/web/server
            python3 -m venv .venv-ci
            . .venv-ci/bin/activate
            pip install -q --upgrade pip
            pip install -q -r requirements.txt
            python -m pytest -q
          elif [ -f apps/web/server/pyproject.toml ]; then
            cd apps/web/server
            python3 -m venv .venv-ci
            . .venv-ci/bin/activate
            pip install -q --upgrade pip
            pip install -q -e .
            python -m pytest -q
          elif [ -f apps/web/server/main.py ] || [ -f apps/web/server/app.py ] || [ -d apps/web/server/tests ]; then
            echo "::error::apps/web/server has code but no declared dependencies - card not done"; exit 1
          else
            echo "::notice::no apps/web/server yet - skipping server tests"
          fi
      - name: Zip dist
        if: hashFiles('apps/web/frontend/dist/**') != ''
        run: |
          cd apps/web/frontend
          zip -qr ../../../ScanList-web-dist.zip dist
      - uses: actions/upload-artifact@v4
        if: hashFiles('ScanList-web-dist.zip') != ''
        with:
          name: scanlist-web-dist
          path: ScanList-web-dist.zip
          if-no-files-found: error

  release:
    needs: [shared, kotlin, rn, web, rn-smoke]
    if: >-
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      contains(needs.*.result, 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: scanlist-*
          merge-multiple: true
          path: rel
      - name: Overwrite rolling release (tag rolling)
        # The rolling release tag must never be named after a branch: a tag refs/tags/main
        # shadow-aliases refs/heads/main repo-wide ("refname 'main' is ambiguous") and broke
        # every ancestry/merge check. The rolling tag is now `rolling`; the leftover `main`
        # tag/release is deleted here (no-op once gone) so it cannot spring back.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Legacy cleanup runs FIRST and unconditionally: path-filtered jobs produce no
          # artifacts on kanban/workflow-only pushes, and the old `ls -la rel` head meant
          # bash -e aborted before any of this ever ran (job red, legacy `main` tag/release
          # stranded). Cleanup is fully `|| true` guarded so it can never fail the job.
          repo="${GITHUB_REPOSITORY:-hajnina/scanlist}"
          # Tag `main` can carry TWO releases (a published one + a stale draft); by-tag
          # deletes handle only one, so delete every release whose tag is `main` by id.
          gh api --paginate "repos/${repo}/releases" \
            --jq '.[] | select(.tag_name=="main") | .id' > main-ids.txt || true
          while read -r rid; do
            [ -n "$rid" ] && gh api -X DELETE "repos/${repo}/releases/${rid}" || true
          done < main-ids.txt
          gh release delete main --yes --cleanup-tag || true
          git push origin :refs/tags/main || true
          git push origin :refs/tags/main || true

          # Tolerate an empty/absent artifact dir (download-artifact creates nothing when
          # every build job was skipped by the path filter).
          mkdir -p rel
          shopt -s nullglob
          files=(rel/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::notice::no build artifacts on this push (path-filtered jobs skipped) - keeping the last good rolling release"
            exit 0
          fi
          ls -la rel
          git push origin :refs/tags/rolling || true
          gh release delete rolling --yes --cleanup-tag || true
          {
            echo "Rolling build from \`main\` - replaces the previous \`rolling\` release."
            echo
            echo "- Commit: ${GITHUB_SHA::7}"
            echo "- Built: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- Assets: Kotlin APK, React Native APK, web dist (whichever tracks exist)"
            echo
            echo "Recent main history:"
            git log --oneline -5 | sed 's/^/- /'
          } > notes.md
          gh release create rolling rel/* --title "ScanList (rolling)" --notes-file notes.md --latest
