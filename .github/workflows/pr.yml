name: PR build
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.f.outputs.shared }}
      kotlin: ${{ steps.f.outputs.kotlin }}
      rn: ${{ steps.f.outputs.rn }}
      web: ${{ steps.f.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            shared:
              - 'shared/**'
              - '.github/workflows/**'
            kotlin:
              - 'apps/kotlin/**'
              - '.github/workflows/**'
            rn:
              - 'apps/rn/**'
              - '.github/workflows/**'
            web:
              - 'apps/web/**'
              - '.github/workflows/**'

  shared:
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: ts-core typecheck + tests
        # CI gap: the job ran vitest only, so a type error in shared/ts-core (the module both apps
        # import) never failed CI. `npm run typecheck` is `tsc --noEmit` per its package.json.
        run: |
          if [ -f shared/ts-core/package.json ]; then
            cd shared/ts-core
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund
            npm run typecheck
            npm test
          elif [ -d shared/ts-core/src ]; then
            echo "::error::shared/ts-core has sources but no package.json - card not done"; exit 1
          else
            echo "::notice::no shared/ts-core yet - nothing to test"
          fi
      - name: android-embed build + JVM tests
        run: |
          if [ ! -f gradlew ] || [ ! -f settings.gradle.kts ]; then echo "::notice::no root gradle build yet (card S9) - skipping"; exit 0; fi
          if [ ! -f shared/android-embed/build.gradle.kts ]; then echo "::notice::no shared/android-embed module yet (card S5) - skipping"; exit 0; fi
          chmod +x gradlew
          ./gradlew --no-daemon :shared:android-embed:assembleDebug :shared:android-embed:testDebugUnitTest

  kotlin:
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          if [ ! -f gradlew ] || [ ! -f settings.gradle.kts ]; then echo "::error::no root gradle build yet (card S9) - cannot build apps/kotlin"; exit 1; fi
          if [ ! -f apps/kotlin/app/build.gradle.kts ] && [ ! -f apps/kotlin/build.gradle.kts ]; then echo "::error::apps/kotlin changed but has no module build file - card not done"; exit 1; fi
          chmod +x gradlew
          ./gradlew --no-daemon :scanlistKotlin:assembleDebug
      - name: Unit tests
        # CI gap: assembleDebug alone never ran the JVM unit tests (apps/kotlin/app/src/test).
        # Same root build/wrapper as the step above, so it reuses the compiled debug classes;
        # testDebugUnitTest is NO-SOURCE-safe (green if a module has no tests).
        run: |
          if [ ! -f gradlew ] || [ ! -f settings.gradle.kts ]; then echo "::error::no root gradle build yet (card S9) - cannot run apps/kotlin unit tests"; exit 1; fi
          chmod +x gradlew
          ./gradlew --no-daemon :scanlistKotlin:testDebugUnitTest
      - name: Unit test summary
        # gradle prints no test totals by default (jest/vitest do), so a silently empty test run
        # would look green. Fail loudly if no reports exist or if nothing actually ran.
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          roots = [
              'apps/kotlin/app/build/test-results/testDebugUnitTest',
              'apps/kotlin/build/test-results/testDebugUnitTest',
          ]
          files = []
          for r in roots:
              files += sorted(glob.glob(r + '/TEST-*.xml'))
          if not files:
              sys.exit('::error::testDebugUnitTest produced no XML reports in ' + ' / '.join(roots))
          total = fails = errors = skipped = 0
          for path in files:
              node = ET.parse(path).getroot()
              total += int(node.get('tests', 0))
              fails += int(node.get('failures', 0))
              errors += int(node.get('errors', 0))
              skipped += int(node.get('skipped', 0))
          print(f'kotlin unit tests: {len(files)} classes, {total} tests, '
                f'{fails} failures, {errors} errors, {skipped} skipped')
          sys.exit(1 if (fails or errors or total == 0) else 0)
          PY
      - name: Rename APK
        if: hashFiles('apps/kotlin/app/build/outputs/apk/debug/*.apk') != ''
        run: mv apps/kotlin/app/build/outputs/apk/debug/*.apk ScanList-kotlin-debug.apk
      - uses: actions/upload-artifact@v4
        if: hashFiles('ScanList-kotlin-debug.apk') != ''
        with:
          name: scanlist-kotlin-apk
          path: ScanList-kotlin-debug.apk
          if-no-files-found: error

  rn:
    needs: changes
    if: needs.changes.outputs.rn == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: JS typecheck + jest
        # CI gap: jest (18 suites / 163 tests) only ever ran on laptops. Placed BEFORE the APK build
        # so a red test fails in ~1 min instead of after the ~6 min gradle build; the debug build does
        # not consume the JS bundle, so the order is otherwise free. Node is the same '22' pin the web
        # job uses (apps/rn engines: >= 22.11.0; setup-node '22' resolves the latest 22.x).
        working-directory: apps/rn
        run: |
          if [ ! -f package.json ]; then echo "::error::apps/rn changed but has no package.json - card not done"; exit 1; fi
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run typecheck
          npm test -- --ci
      - name: Build APK
        working-directory: apps/rn/android
        run: |
          if [ ! -f gradlew ]; then echo "::error::apps/rn changed but has no android gradle wrapper - card not done"; exit 1; fi
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Rename APK
        # Direct path (A2 CI diagnosis): the '**' variant made hashFiles walk the whole
        # android build tree (A4's deps made it big) and hit GitHub's 120 s template limit.
        # The APK's location is deterministic — apps/rn/android/app/build/outputs/apk/debug/.
        if: hashFiles('apps/rn/android/app/build/outputs/apk/debug/*.apk') != ''
        run: mv apps/rn/android/app/build/outputs/apk/debug/*.apk ScanList-rn-debug.apk
      - uses: actions/upload-artifact@v4
        if: hashFiles('ScanList-rn-debug.apk') != ''
        with:
          name: scanlist-rn-apk
          path: ScanList-rn-debug.apk
          if-no-files-found: error

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend
        run: |
          if [ -f apps/web/frontend/package.json ]; then
            cd apps/web/frontend
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund
            npm test --if-present
            npm run build --if-present
          elif [ -d apps/web/frontend/src ]; then
            echo "::error::apps/web/frontend has sources but no package.json - card not done"; exit 1
          else
            echo "::notice::no apps/web/frontend yet - skipping frontend build"
          fi
      - name: Server tests
        run: |
          if [ -f apps/web/server/requirements.txt ]; then
            cd apps/web/server
            python3 -m venv .venv-ci
            . .venv-ci/bin/activate
            pip install -q --upgrade pip
            pip install -q -r requirements.txt
            python -m pytest -q
          elif [ -f apps/web/server/pyproject.toml ]; then
            cd apps/web/server
            python3 -m venv .venv-ci
            . .venv-ci/bin/activate
            pip install -q --upgrade pip
            pip install -q -e .
            python -m pytest -q
          elif [ -f apps/web/server/main.py ] || [ -f apps/web/server/app.py ] || [ -d apps/web/server/tests ]; then
            echo "::error::apps/web/server has code but no declared dependencies - card not done"; exit 1
          else
            echo "::notice::no apps/web/server yet - skipping server tests"
          fi
      - name: Zip dist
        if: hashFiles('apps/web/frontend/dist/**') != ''
        run: |
          cd apps/web/frontend
          zip -qr ../../../ScanList-web-dist.zip dist
      - uses: actions/upload-artifact@v4
        if: hashFiles('ScanList-web-dist.zip') != ''
        with:
          name: scanlist-web-dist
          path: ScanList-web-dist.zip
          if-no-files-found: error
