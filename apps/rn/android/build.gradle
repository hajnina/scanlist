buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        // Card A6 (nit a): the shared embedding engine needs Android 12. This used to be injected by
        // a `gradle.beforeProject` hook in settings.gradle; it is a real project fact, so it lives here.
        minSdkVersion = 31
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
