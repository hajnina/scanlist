pluginManagement {
    /*
     * ScanList bootstrap (card A1, see ../BUILD.md hack 6).
     *
     * node_modules is gitignored (AGENTS.md) and React Native's autolinking + the included
     * :react-native Gradle plugin live in node_modules, while the lead-owned CI workflow
     * (.github/workflows/pr.yml, `rn` job) builds this directory with a bare
     * `./gradlew --no-daemon assembleDebug` and has no npm step. Install the JS dependencies
     * here when they are missing — once per checkout, on the laptop, in CI and in a new
     * worktree alike. Idempotent: skipped as soon as node_modules/react-native exists.
     */
    def scanlistAppRoot = new File(settingsDir, '..').canonicalFile
    if (!new File(scanlistAppRoot, 'node_modules/react-native').exists()) {
        println "[scanlist] node_modules missing in ${scanlistAppRoot} — running 'npm install' (one-off)"
        def npm = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'
        def process = new ProcessBuilder(npm, 'install', '--no-audit', '--no-fund')
                .directory(scanlistAppRoot)
                .inheritIO()
                .start()
        def exit = process.waitFor()
        if (exit != 0) {
            throw new GradleException("npm install failed (exit ${exit}) in ${scanlistAppRoot}")
        }
    }

    includeBuild("../node_modules/@react-native/gradle-plugin")
}

plugins { id("com.facebook.react.settings") }

extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }

rootProject.name = 'dev.hajnina.scanlist.rn'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

/*
 * ScanList bootstrap (card A3) — the shared on-device embedding engine.
 *
 * `shared/android-embed` (card S5) is a plain Kotlin Android library at the repo root: it has no
 * package.json, so RN autolinking cannot see it, and it is included by path here.
 *
 * Card A6 folded the old `gradle.beforeProject` hook (minSdk bump, `implementation` dependency and
 * the Kotlin metadata flag) into the modules that own those facts:
 *
 *   - `android/build.gradle`: `minSdkVersion = 31` (LiteRT-LM 0.18.1 needs Android 12);
 *   - `app/build.gradle`: `implementation project(':android-embed')` + `-Xskip-metadata-version-check`;
 *
 * so this file only includes the project. Keep the include-if-exists guard: a checkout without
 * `shared/android-embed` still configures (and then fails with the explicit message below).
 */
def scanlistEmbedProjectDir = new File(settingsDir, '../../../shared/android-embed').canonicalFile
if (new File(scanlistEmbedProjectDir, 'build.gradle.kts').isFile()) {
    include ':android-embed'
    project(':android-embed').projectDir = scanlistEmbedProjectDir
} else {
    println "[scanlist] shared/android-embed not found at ${scanlistEmbedProjectDir} — the build FAILS without the embed module (card A3: EmbedModule.kt is compiled unconditionally; provide the path above or restore the checkout)"
}
