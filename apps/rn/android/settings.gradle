pluginManagement {
    /*
     * ScanList bootstrap (card A1, see ../BUILD.md hack 6).
     *
     * node_modules is gitignored (AGENTS.md) and React Native's autolinking + the included
     * :react-native Gradle plugin live in node_modules, while the lead-owned CI workflow
     * (.github/workflows/pr.yml, `rn` job) builds this directory with a bare
     * `./gradlew --no-daemon assembleDebug` and has no npm step. Install the JS dependencies
     * here when they are missing — once per checkout, on the laptop, in CI and in a new
     * worktree alike. Idempotent: skipped as soon as node_modules/react-native exists.
     */
    def scanlistAppRoot = new File(settingsDir, '..').canonicalFile
    if (!new File(scanlistAppRoot, 'node_modules/react-native').exists()) {
        println "[scanlist] node_modules missing in ${scanlistAppRoot} — running 'npm install' (one-off)"
        def npm = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'
        def process = new ProcessBuilder(npm, 'install', '--no-audit', '--no-fund')
                .directory(scanlistAppRoot)
                .inheritIO()
                .start()
        def exit = process.waitFor()
        if (exit != 0) {
            throw new GradleException("npm install failed (exit ${exit}) in ${scanlistAppRoot}")
        }
    }

    includeBuild("../node_modules/@react-native/gradle-plugin")
}

plugins { id("com.facebook.react.settings") }

extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }

rootProject.name = 'dev.hajnina.scanlist.rn'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

/*
 * ScanList bootstrap (card A3) — the shared on-device embedding engine, and the two build facts it
 * brings. `shared/android-embed` (card S5) is a plain Kotlin Android library at the repo root: it has
 * no package.json, so RN autolinking cannot see it, and it is included by path here.
 *
 * The `include` alone does not put it on `:app`'s classpath, and the API floor has to move too:
 * LiteRT-LM 0.18.1 needs Android 12 (API 31) while the RN skeleton pins minSdk 24
 * (`android/build.gradle`). Both are applied below, before `:app` is evaluated, because
 * `app/build.gradle` and `android/build.gradle` are outside this card's `owns`:
 *
 *   - rootProject.ext.minSdkVersion = 31  (app/build.gradle reads it in its android {} block)
 *   - implementation project(':android-embed') as soon as the Android plugin is applied
 *
 * Prefer plain files? Move those two lines into `app/build.gradle` (and bump the ext in
 * `android/build.gradle`) and delete this block except the `include` + `projectDir` pair.
 */
def scanlistEmbedProjectDir = new File(settingsDir, '../../../shared/android-embed').canonicalFile
if (new File(scanlistEmbedProjectDir, 'build.gradle.kts').isFile()) {
    include ':android-embed'
    project(':android-embed').projectDir = scanlistEmbedProjectDir

    gradle.beforeProject { project ->
        if (project.path == ':app') {
            project.rootProject.ext.minSdkVersion = 31
            project.plugins.withId('com.android.application') {
                // `implementation` exists as soon as AGP's configurations are created (plugin applied).
                project.dependencies.add(
                        'implementation',
                        project.project(':android-embed'))

                // LiteRT-LM 0.18.1 is built with Kotlin 2.4 metadata while RN 0.88 compiles this app
                // with Kotlin 2.2 (see shared/android-embed/README.md §"LiteRT-LM version decision").
                // The library passes this flag to its own compiler; the app compiles against the same
                // AAR (api dependency) and needs it too. Compile-time only, no runtime effect.
                project.tasks.matching { task ->
                    task.name.startsWith('compile') && task.name.endsWith('Kotlin')
                }.configureEach { task ->
                    task.compilerOptions.freeCompilerArgs.add('-Xskip-metadata-version-check')
                }
            }
        }
    }
} else {
    println "[scanlist] shared/android-embed not found at ${scanlistEmbedProjectDir} — building without the embed module (card A3)"
}
