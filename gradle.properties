# ScanList — root Gradle properties (card S9).
#
# Deliberately NO host/laptop paths and NO android.aapt2FromMavenOverride here: the aarch64 aapt2
# lives in scripts/android-env.sh (AGENTS.md), so CI (x86_64) and this laptop build identical files
# and CI uses the Maven aapt2. Keep it that way.

org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is used by every module (Compose / activity / LiteRT-LM samples); required by AGP.
android.useAndroidX=true
android.nonTransitiveRClass=true
